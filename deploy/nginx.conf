# Sustituir canchas.example.com y el socket si se utiliza otra versión PHP.
# Instalar después de obtener el certificado con certbot certonly --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name canchas.example.com;
    return 301 https://canchas.example.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name canchas.example.com;
    root /srv/canchas/current/backend/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/canchas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canchas.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Quasar usa estilos inline; scripts solo del propio origen y fuentes empaquetadas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    access_log /var/log/nginx/canchas-access.log;
    error_log /var/log/nginx/canchas-error.log warn;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        # No repetir add_header aquí: se conservan las cabeceras del servidor.
    }
    location = /index.html { expires -1; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}
